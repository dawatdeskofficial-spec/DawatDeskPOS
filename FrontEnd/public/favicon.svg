<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <!-- Circular Badge Background -->
  <circle cx="100" cy="100" r="98" fill="#11141c" />
  
  <!-- Outer Ring with opening on the right -->
  <path
    d="M 169.5 91 A 78 78 0 1 0 166 126"
    stroke="#ffffff"
    stroke-width="12.5"
    stroke-linecap="butt"
  />

  <!-- Horizontal Center Bar -->
  <line
    x1="15"
    y1="108.5"
    x2="158"
    y2="108.5"
    stroke="#ffffff"
    stroke-width="12.5"
    stroke-linecap="butt"
  />

  <!-- Cloche Dome Arch -->
  <path
    d="M 56 99 A 43 40 0 0 1 92 57.5 C 94 49 104 49 106 57.5 A 43 40 0 0 1 142 99"
    stroke="#ffffff"
    stroke-width="12.5"
    stroke-linecap="butt"
    stroke-linejoin="round"
    fill="none"
  />
  <!-- Handle Knob -->
  <path
    d="M 92 57.5 C 94 49 104 49 106 57.5 Z"
    fill="#ffffff"
  />

  <!-- Golden Amber Crescent -->
  <path
    d="M 68 99 C 69 88.5 74 78.5 80.5 73 C 84 70 88 68 92.5 66.5 C 89 71.5 86 78.5 84 86 C 82.5 90.5 81.8 95 81.5 99 Z"
    fill="#c5982f"
  />

  <!-- Stylized Letter 'D' -->
  <path
    d="M 72 114.5 V 137 C 72 147.5 78.5 147.5 89 147.5 H 106 C 124 147.5 134 135 134 114.5"
    stroke="#ffffff"
    stroke-width="12.5"
    stroke-linecap="butt"
    stroke-linejoin="round"
    fill="none"
  />

  <!-- Golden Amber Dot at 3 o'clock -->
  <circle
    cx="176.5"
    cy="108.5"
    r="9.8"
    fill="#c5982f"
  />
</svg>
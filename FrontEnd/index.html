<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DawatDesk POS</title>

  <!-- Intelligent Hidden DOM Translation (English, Gujarati, Hindi) -->
  <script type="text/javascript">
    function googleTranslateElementInit() {
      new google.translate.TranslateElement({
        pageLanguage: 'en',
        includedLanguages: 'en,gu,hi',
        autoDisplay: false
      }, 'google_translate_element');
    }
  </script>
  <script type="text/javascript"
    src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>

  <style>
    /* Prevent massive Google layout distortions */
    .skiptranslate iframe,
    .skiptranslate.goog-te-banner-frame {
      display: none !important;
    }

    body {
      top: 0px !important;
    }

    /* Hide the ugly default tool */
    #google_translate_element {
      display: none;
    }

    /* Disable tooltip popups on translated text */
    .goog-text-highlight {
      background-color: transparent !important;
      border: none !important;
      box-shadow: none !important;
    }

    #goog-gt-tt {
      display: none !important;
    }
  </style>
</head>

<body>
  <!-- Hidden mount root for Google DOM Translation Engine -->
  <div id="google_translate_element"></div>
  <div id="app"></div>
  <script type="module" src="/src/main.ts"></script>
</body>

</html>

<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DawatDesk POS</title>

  <!-- Immediate purge of legacy service workers and stale browser caches -->
  <script>
    (function() {
      if (typeof window !== 'undefined' && 'serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(regs) {
          for (var i = 0; i < regs.length; i++) {
            regs[i].unregister();
          }
          if ('caches' in window) {
            caches.keys().then(function(keys) {
              for (var j = 0; j < keys.length; j++) {
                caches.delete(keys[j]);
              }
            });
          }
          if (navigator.serviceWorker.controller && !sessionStorage.getItem('dd_sw_cleared')) {
            sessionStorage.setItem('dd_sw_cleared', '1');
            window.location.reload();
          }
        }).catch(function() {});
      }
    })();
  </script>

  <!-- Intelligent Hidden DOM Translation (English, Gujarati, Hindi) -->
  <script type="text/javascript">
    function googleTranslateElementInit() {
      try {
        if (window.google && window.google.translate) {
          new google.translate.TranslateElement({
            pageLanguage: 'en',
            includedLanguages: 'en,gu,hi',
            autoDisplay: false
          }, 'google_translate_element');
        }
      } catch (e) {
        console.warn('Google Translate init bypassed:', e);
      }
    }
  </script>
  <script type="text/javascript" async defer
    src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>

  <style>
    /* Prevent massive Google layout distortions */
    .skiptranslate iframe,
    .skiptranslate.goog-te-banner-frame {
      display: none !important;
    }

    body {
      top: 0px !important;
    }

    /* Hide the ugly default tool */
    #google_translate_element {
      display: none;
    }

    /* Disable tooltip popups on translated text */
    .goog-text-highlight {
      background-color: transparent !important;
      border: none !important;
      box-shadow: none !important;
    }

    #goog-gt-tt {
      display: none !important;
    }
  </style>
</head>

<body>
  <!-- Hidden mount root for Google DOM Translation Engine -->
  <div id="google_translate_element"></div>
  <div id="app"></div>
  <script type="module" src="/src/main.ts"></script>
</body>

</html>
